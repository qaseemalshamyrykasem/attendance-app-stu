name: attendance
description: "نظام الحضور الذكي - تطبيق الطالب (Offline Attendance System Student)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.1.0

  # Database - Drift (SQLite)
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Network & HTTP
  dio: ^5.4.0
  http: ^1.1.2
  connectivity_plus: ^6.0.0

  # QR Code Scanning
  mobile_scanner: ^5.0.0

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Security & Utils
  crypto: ^3.0.3
  encrypt: ^5.0.1
  logger: ^2.0.2+1
  intl: ^0.20.2
  uuid: ^4.2.2
  device_info_plus: ^10.1.0
  image_picker: ^1.0.7
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
